name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 is the floor in package.json `engines` and the version both
      # Cadence and Money Manager build on, so it is the version that has to work.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` also runs this package's `prepare` script, which builds dist/.
      # The explicit Build step below is kept anyway so a broken build is
      # reported as a build failure rather than as an install failure.
      - name: Install dependencies
        run: npm ci

      # MC-7: ONE step running the package's own `verify`, which deliberately
      # builds BEFORE testing — the "use client" assertions read the SHIPPED
      # files in dist/, so a test-then-build order only ever tested the build
      # `prepare` happened to leave behind. Running the same script a human
      # runs also means CI cannot drift from the documented ordering again.
      - name: Verify (typecheck, build, test)
        run: npm run verify
